name: Task Reminder Push (15-min)

# ─────────────────────────────────────────────────────────────────────────
# Standalone ~15-minute task-reminder tick (30-min cooldown per reminder), split out of push-notify.yml on
# 2026-07-18 to fix two reliability problems observed in production:
#
#   1. It previously fired at exactly '*/30 * * * *' — i.e. :00 and :30 of
#      every hour. GitHub's own docs warn that scheduled workflows are most
#      likely to be delayed at the start of every hour (and, by the same
#      logic, the half-hour) because that's when the platform-wide load from
#      every repo's scheduled workflows peaks. This workflow instead fires
#      at :07 and :37 — off the round-number boundary — to reduce that risk.
#
#   2. It previously shared a `concurrency: group: push-notifications` with
#      the 9 two-hour module-bunch crons in push-notify.yml. With
#      cancel-in-progress:false, GitHub only keeps the MOST RECENTLY QUEUED
#      pending run per concurrency group — so if a module-bunch run was
#      still in progress when a tick fired, that tick queued, and if another
#      tick then fired 30 minutes later before the first queued run got a
#      chance to execute, the first one was silently dropped entirely (no
#      error, no log — it just never ran). This is what caused the multi-hour
#      gaps between reminders despite the cron firing on schedule.
#      Giving this tick its own concurrency group means it can never be
#      blocked or dropped by the other 9 crons, and vice versa.
#
# This workflow calls the exact same send-push.js / sendTaskReminderToUser()
# path as before, in TASK_REMINDER_ONLY_MODE — it does not touch
# HOUR_SCHEDULE or any of the module-bunch logic in push-notify.yml, which
# is completely unaffected by this split.
# ─────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Every ~15 min, offset off :00/:30 (see note above), restricted to
    # UTC hours 3-12 == 9:07am-6:52pm Dhaka (UTC+6, no DST). This matches
    # send-push.js's own TASK_REMINDER_HOUR_START(9)/END(19) business-hours
    # gate (grace-buffered to 19 — see that file), which remains in place as
    # a redundant safety net.
    # FIX (2026-07-19): previously fired all 24 hours and relied solely on
    # that script-side gate to self-reject ~30 of ~48 daily runs outside
    # 9am-6pm — wasteful and confusing in the Actions run history.
    # FIX (2026-07-22): added :22/:52 backup ticks (30min -> ~15min cadence)
    # and extended the hour range by one, so that a GitHub Actions scheduling
    # delay (platform is best-effort, not guaranteed on-time — see push_worker
    # incident where a 3:37/11:xx-UTC-slot run actually executed at 12:58
    # UTC and was silently dropped by the old 18:00 Dhaka gate) has a much
    # smaller chance of pushing a run past business hours entirely, and if
    # one tick is delayed/dropped, the next tick ~15 min later still catches
    # the same due reminder before the 30-min cooldown window would matter.
    # This does NOT eliminate the theoretical gap (an extreme delay beyond
    # 19:00 Dhaka is still possible), just shrinks it to a small, unlikely one.
    - cron: '7,22,37,52 3-12 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — show what would be sent without actually sending'
        required: false
        default: 'false'

concurrency:
  group: task-reminder-push
  cancel-in-progress: false

jobs:
  send-task-reminder:
    name: Send Task Reminder (15-min tick)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: push-worker/package-lock.json

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci --no-audit
        working-directory: push-worker
        timeout-minutes: 5

      - name: Validate configuration
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY:           ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY:          ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:              ${{ secrets.VAPID_SUBJECT }}
          ACTION_TOKEN_SECRET:        ${{ secrets.ACTION_TOKEN_SECRET }}
          FAILURE_NOTIFY_EMAIL:       ${{ secrets.FAILURE_NOTIFY_EMAIL }}
          MAIL_SERVER:                ${{ secrets.MAIL_SERVER }}
          MAIL_PORT:                  ${{ secrets.MAIL_PORT }}
          GMAIL_USER:                 ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:         ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          echo "🔍 Validating secrets..."

          required_secrets=(
            "SUPABASE_URL"
            "SUPABASE_SERVICE_ROLE_KEY"
            "VAPID_PUBLIC_KEY"
            "VAPID_PRIVATE_KEY"
            "VAPID_SUBJECT"
          )

          missing_secrets=()

          for secret in "${required_secrets[@]}"; do
            var_value="${!secret}"
            if [ -z "$var_value" ]; then
              missing_secrets+=("$secret")
              echo "❌ Missing: $secret"
            else
              echo "✅ Found:   $secret (${#var_value} chars)"
            fi
          done

          if [ ${#missing_secrets[@]} -gt 0 ]; then
            echo ""
            echo "⚠️  The following required secrets are not set:"
            for s in "${missing_secrets[@]}"; do
              echo "   - $s"
            done
            echo ""
            echo "Add them at: repo → Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo ""
          echo "✅ All required secrets are present."

          # N-3: not required (pushes still go out without it), so this only warns. Without it
          # send-push.js adds no action token, and snooze / seen / undo on a notification with
          # the tab closed silently do nothing. Must equal the Supabase secret of the same name.
          if [ -z "$ACTION_TOKEN_SECRET" ]; then
            echo "::warning title=ACTION_TOKEN_SECRET missing::Closed-tab snooze/seen/undo buttons will not work. Add the secret (same value as in Supabase)."
          else
            echo "✅ Found:   ACTION_TOKEN_SECRET (${#ACTION_TOKEN_SECRET} chars)"
          fi

          # N-2: not required for pushes, but without these a red run alerts nobody
          # (the failure email falls back to noreply@example.com).
          if [ -z "$FAILURE_NOTIFY_EMAIL" ]; then
            echo "::warning title=FAILURE_NOTIFY_EMAIL missing::Failure alert emails go to noreply@example.com, so nobody is told when a run fails. Add the secret."
          fi
          for m in MAIL_SERVER MAIL_PORT GMAIL_USER GMAIL_APP_PASSWORD; do
            if [ -z "${!m}" ]; then
              echo "::warning title=$m missing::Failure alert email cannot be sent without this secret."
            fi
          done

      - name: Send task reminder
        id: push_worker
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY:          ${{ secrets.SUPABASE_ANON_KEY }}   # A1: public anon key; sw.js needs it for closed-tab actions
          VAPID_PUBLIC_KEY:           ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY:          ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:              ${{ secrets.VAPID_SUBJECT }}
          DRY_RUN:                    ${{ github.event.inputs.dry_run }}
          RUN_ID:                     ${{ github.run_id }}
          WORKFLOW_RUN_NUMBER:        ${{ github.run_number }}
          GITHUB_ACTOR:               ${{ github.actor }}
          IS_MANUAL_TRIGGER:          ${{ github.event_name == 'workflow_dispatch' }}
          ## Always true in this workflow — this file's only job is the
          ## standalone ~15-min task-reminder tick. Unlike the old shared
          ## workflow, there is no need to derive this from
          ## github.event.schedule since every trigger here means the same
          ## thing.
          TASK_REMINDER_ONLY_MODE:    'true'
          ## Option D (F84): signs the reminder buttons so push-action accepts them
          ## with the tab closed. Same value as the Supabase secret of this name.
          ACTION_TOKEN_SECRET:        ${{ secrets.ACTION_TOKEN_SECRET }}
        run: |
          echo "🚀 Starting task reminder tick (15-min cadence, 30-min cooldown)..."
          echo ""
          echo "Run information:"
          echo "  Run ID:         $RUN_ID"
          echo "  Run Number:     $WORKFLOW_RUN_NUMBER"
          echo "  Triggered by:   $GITHUB_ACTOR"
          echo "  Manual trigger: $IS_MANUAL_TRIGGER"
          echo "  Dry run:        $DRY_RUN"
          echo ""

          node send-push.js
          exit_code=$?

          echo ""
          echo "Worker exit code: $exit_code"
          echo "push_worker_exit_code=$exit_code" >> $GITHUB_OUTPUT

          exit $exit_code
        working-directory: push-worker
        timeout-minutes: 8
        ## B5-4: no continue-on-error here, so failure() in the alert step below
        ## fires. The summary and final-status steps use always(), so they still run.

      - name: Generate job summary
        if: always()
        run: |
          echo "# Task Reminder Push — Summary" >> $GITHUB_STEP_SUMMARY
          echo ""                                >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |"               >> $GITHUB_STEP_SUMMARY
          echo "|---|---|"                        >> $GITHUB_STEP_SUMMARY
          echo "| Run ID | ${{ github.run_id }} |"         >> $GITHUB_STEP_SUMMARY
          echo "| Run number | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |"    >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u +'%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo ""                                >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.push_worker.outcome }}" == "success" ]; then
            echo "**Status: ✅ Success**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status: ❌ Failed — check logs above**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Send email notification on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port:    ${{ secrets.MAIL_PORT }}
          username:       ${{ secrets.GMAIL_USER }}
          password:       ${{ secrets.GMAIL_APP_PASSWORD }}
          subject:        '❌ Task Reminder Push Failed — Run #${{ github.run_number }}'
          to:             ${{ secrets.FAILURE_NOTIFY_EMAIL || 'noreply@example.com' }}
          from:           'github-actions@officemanagement.app'
          body: |
            The 15-minute task reminder tick failed.

            Run details:
              Run Number  : ${{ github.run_number }}
              Repository  : ${{ github.repository }}
              Branch      : ${{ github.ref }}
              Triggered by: ${{ github.actor }}
              Event       : ${{ github.event_name }}

            View full logs:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            Automatic notification from GitHub Actions
        continue-on-error: true

      - name: Final status check
        if: always()
        run: |
          if [ "${{ steps.push_worker.outcome }}" == "success" ]; then
            echo "✅ Task reminder tick completed successfully"
            exit 0
          else
            echo "❌ Task reminder tick failed — check logs above"
            exit 1
          fi
